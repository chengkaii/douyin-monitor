# 监测账号清单（复制为 accounts.yaml，或直接用 npm run add-account -- "<链接>" 自动录入）
# 支持纯 sec_user_id / 主页链接 / 短链 / 整段分享文案；短链只跟随 douyin.com 域内的重定向
# 也可以在本文件里直接粘主页链接，config.ts 会同步抠出 /user/ 后的 id（短链需先经 add-account 转换）
accounts:
  - name: "示例账号A"
    sec_user_id: "MS4wLjABAAAA_REPLACE_ME"
    enabled: false

polling:
  intervalMinutes: 5        # 每账号轮询周期
  jitterSeconds: 120        # 错峰随机抖动上限
  minGapSeconds: 8          # 两次请求最小间隔，保护容器身份池
  nightIntervalMinutes: 15  # 夜间放宽周期
  nightStartHour: 0
  nightEndHour: 6
  timeZone: Asia/Shanghai  # 夜间窗口按哪个时区判定；Linux 服务器常为 UTC，勿删

download:
  concurrency: 2
  maxRetries: 3
  minBytes: 1048576         # 小于 1MB 视为损坏
  retryDelaysMs: [30000, 120000, 600000]

retry:
  maxAttempts: 5        # 单条视频跨轮最多处理次数（1 次首发 + 4 次自动重投）
  everyRounds: 20       # serve 每 20 轮（15s/轮 ≈ 5 分钟）扫一次 failed

oss:
  prefix: "douyin-monitor/"
